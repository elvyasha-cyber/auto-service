# Сайт слушает только внутри Docker. Снаружи его открывает общая дверь сервера на порту 443.
# Описание API (/docs) снаружи закрыто: это инструмент отладки.

server {
    listen 80;
    server_name _;

    location /docs {
        default_type text/plain;
        return 403 "403 Forbidden\n";
    }

    location /redoc {
        default_type text/plain;
        return 403 "403 Forbidden\n";
    }

    location = /openapi.json {
        default_type text/plain;
        return 403 "403 Forbidden\n";
    }

    location /leads {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /lead-metrics {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin-data {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /behavior-metrics {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        root /usr/share/nginx/html;
        try_files /admin.html =404;
        add_header Cache-Control "no-store";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }
}

# Порт 5432 на хосте — не Postgres. Сюда снаружи приходит отказ 403.
# Сама база слушает 5432 только внутри сети контейнеров.
server {
    listen 5432 default_server;
    server_name _;
    default_type text/plain;
    return 403 "403 Forbidden\n";
}
